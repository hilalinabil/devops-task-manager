<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Task Manager</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">Task Manager</div>
      <p class="auth-subtitle">Create your account to start managing tasks</p>
    </div>

    <!-- Alert Container -->
    <div id="alertBox" class="alert alert-hidden"></div>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input 
          type="text" 
          id="username" 
          class="form-input" 
          placeholder="Choose a username" 
          required 
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input 
          type="email" 
          id="email" 
          class="form-input" 
          placeholder="yourname@example.com" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input 
          type="password" 
          id="password" 
          class="form-input" 
          placeholder="At least 6 characters" 
          required 
          autocomplete="new-password"
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <input 
          type="password" 
          id="confirmPassword" 
          class="form-input" 
          placeholder="Re-type your password" 
          required 
          autocomplete="new-password"
        >
      </div>

      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-secondary);">
      Already have an account? <a href="/pages/login.html">Sign In</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Redirect if user is already logged in
    if (localStorage.getItem('token')) {
      window.location.replace('/pages/dashboard.html');
    }
  </script>
</body>
</html>
