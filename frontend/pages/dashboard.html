<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Task Manager</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script>
    // Prevent flash of protected content before DOM compiles
    if (!localStorage.getItem('token')) {
      window.location.replace('/pages/login.html');
    }
  </script>
</head>
<body>

  <div class="dashboard-container">
    <!-- Navbar Header -->
    <nav class="navbar">
      <div class="nav-brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: #6366f1;">
          <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
        Task Manager
      </div>
      <div class="nav-user">
        <div class="user-tag">
          Hi, <span id="userNameDisplay" class="user-name">User</span>
        </div>
        <button id="logoutBtn" class="btn btn-secondary btn-sm">Sign Out</button>
      </div>
    </nav>

    <!-- Main Content Panel -->
    <main class="dashboard-main">
      <div class="dashboard-header">
        <div class="dashboard-title-group">
          <h2>Your Tasks</h2>
          <p>Organize, track, and accomplish your milestones</p>
        </div>
        <button id="openCreateModalBtn" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New Task
        </button>
      </div>

      <!-- Alert Notification Banner -->
      <div id="dashboardAlert" class="alert alert-hidden" style="margin-bottom: 24px;"></div>

      <!-- Filter controls -->
      <div class="controls-panel">
        <div class="filter-group">
          <button class="filter-btn active" data-filter="ALL">All Tasks</button>
          <button class="filter-btn" data-filter="TODO">To Do</button>
          <button class="filter-btn" data-filter="IN_PROGRESS">In Progress</button>
          <button class="filter-btn" data-filter="DONE">Completed</button>
        </div>
        <div style="font-size: 0.9rem; color: var(--text-secondary);">
          Showing: <span id="taskCounter">0</span> tasks
        </div>
      </div>

      <!-- Task Cards Grid -->
      <div id="tasksGrid" class="tasks-grid">
        <!-- Rendered dynamically by javascript -->
      </div>
    </main>
  </div>

  <!-- Create/Edit Task Modal -->
  <div id="taskModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Create New Task</h3>
        <button class="modal-close" id="closeModalBtn">&times;</button>
      </div>
      <form id="taskForm" novalidate>
        <div class="modal-body">
          <input type="hidden" id="taskIdField">
          
          <div class="form-group">
            <label for="taskTitle" class="form-label">Task Title</label>
            <input 
              type="text" 
              id="taskTitle" 
              class="form-input" 
              placeholder="e.g. Design Landing Page" 
              required
            >
          </div>

          <div class="form-group">
            <label for="taskDesc" class="form-label">Description</label>
            <textarea 
              id="taskDesc" 
              class="form-input" 
              rows="4" 
              placeholder="Detail the steps required for this task..." 
              style="resize: vertical; font-family: inherit;"
            ></textarea>
          </div>

          <div class="form-group" id="statusGroup" style="display: none;">
            <label for="taskStatus" class="form-label">Status</label>
            <select id="taskStatus" class="form-input" style="background-color: #0b0f19;">
              <option value="TODO">To Do</option>
              <option value="IN_PROGRESS">In Progress</option>
              <option value="DONE">Completed</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveTaskBtn">Create Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Task Confirmation Modal -->
  <div id="deleteModal" class="modal">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header" style="border-bottom: none;">
        <h3>Delete Task</h3>
        <button class="modal-close" id="closeDeleteModalBtn">&times;</button>
      </div>
      <div class="modal-body" style="padding-top: 0;">
        <p style="color: var(--text-secondary);">Are you sure you want to permanently delete this task? This action cannot be undone.</p>
        <input type="hidden" id="deleteTaskIdField">
      </div>
      <div class="modal-footer" style="border-top: none; background: transparent;">
        <button type="button" class="btn btn-secondary btn-sm" id="cancelDeleteBtn">Cancel</button>
        <button type="button" class="btn btn-danger btn-sm" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
